
name: Build Hotel Manager Pro for Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build Windows installer and portable app
        run: npm run dist

      - name: Upload Windows EXE files
        uses: actions/upload-artifact@v4
        with:
          name: Hotel-Manager-Pro-Windows
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30
