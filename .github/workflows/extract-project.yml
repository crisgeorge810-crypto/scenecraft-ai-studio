
name: Extract SceneCraft AI Studio

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract complete SceneCraft project
        run: |
          ZIP="SceneCraft-AI-Studio-Complete-Starter.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: Project ZIP not found: $ZIP"
            echo "Files in repository:"
            ls -la
            exit 1
          fi

          mkdir -p /tmp/scenecraft
          unzip -o "$ZIP" -d /tmp/scenecraft

          cp -a /tmp/scenecraft/SceneCraft-AI-Studio/. .

      - name: Save extracted project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No changes to save."
          else
            git commit -m "Install complete SceneCraft AI Studio project"
            git push
          fi
